# 既定はOAuth認証なしのHTTP MCPサーバーです。
#
#   docker compose up --build
#     → http://localhost:8888/mcp
#
# 用途: もともとは本サーバーと同一マシン上で動くMCPクライアントからの利用を想定していました。
# しかし、いくつかのクライアントソフト（例: Claude Desktop、ChatGPT Desktop）とは連携できない
# ことが分かったため、いまは参考としてこのファイルを公開しています。
# - Claude Desktopの場合: インターネットで公開されたMCPサーバーにしかアクセスできないため、このファイルは使えません。
# - ChatGPT Desktopの場合: 専用トンネル経由でローカルのMCPサーバーと連携するため、このファイルは不要です。

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: place-ratings-analyzer:latest
    container_name: place-ratings-analyzer
    ports:
      - "8888:8888"
    # Chromium は既定の 64MB の /dev/shm では落ちることがある
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 8888), timeout=3).close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
