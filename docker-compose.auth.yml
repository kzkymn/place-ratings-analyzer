# OAuth 認証を有効にするための差分ファイル。docker-compose.yml に重ねて使う:
#
#   docker compose -f docker-compose.yml -f docker-compose.auth.yml up --build
#
# .env の MCP_CLIENT_ID / MCP_CLIENT_SECRET / MCP_BASE_URL がコンテナの環境変数として
# 注入され、src/server.py の setup_oauth() が GoogleProvider を構築する。
#
# MCP_BASE_URL は http://localhost:8888 のままにすること。Google の OAuth クライアントに
# 登録済みのリダイレクト URI が http://localhost:8888/auth/callback で、ホスト側の
# localhost:8888 がこのコンテナの 8888 にマップされているため、そのまま繋がる。
services:
  mcp:
    env_file:
      - .env
