# [試作] OAuthの動作確認用の試作物です。GCPなどを用いたデプロイ手順は年内をめどに公開予定です。
# docker-compose.ymlと一緒に指定して使います:
#
#   docker compose -f docker-compose.yml -f docker-compose.auth.yml up --build
#
# .envのMCP_CLIENT_ID / MCP_CLIENT_SECRET / MCP_BASE_URLをコンテナの環境変数として注入し、
# src/server.pyのsetup_oauth()がGoogleProviderを構築します。
#
# MCP_BASE_URLはhttp://localhost:8888のままにしてください。GoogleのOAuthクライアントに登録する
# リダイレクトURIはhttp://localhost:8888/auth/callbackで、ホスト側のlocalhost:8888がこの
# コンテナの8888にマッピングされているため、そのままつながります。
services:
  mcp:
    env_file:
      - .env
